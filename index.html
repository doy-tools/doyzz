<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Error</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font-family:monospace;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.top{background:red;color:#fff;text-align:center;padding:15px;font-weight:900;font-size:20px;animation:blink.4s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0.2}}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
h1{font-size:28px;color:#fff;margin-bottom:20px;text-shadow:0 0 10px #0f0}
.btn{background:#0f0;color:#000;border:0;padding:20px 40px;font-size:22px;font-weight:900;border-radius:15px;cursor:pointer;box-shadow:0 0 20px #0f0}
#log{height:35vh;background:#111;border:1px solid #0f0;margin:10px;padding:10px;font-size:11px;overflow:hidden;text-align:left}
.bar{width:95%;height:20px;background:#222;border:1px solid #0f0;margin:10px auto;overflow:hidden}
#fill{height:100%;width:0%;background:linear-gradient(90deg,#0f0,#ff0);transition:width.1s}
#pct{text-align:center;font-size:12px}
</style>
</head>
<body>

<div class="top">⚠️ SYSTEM SECURITY ALERT ⚠️</div>

<div class="center" id="center">
<h1 id="title">TAP / KLIK LAYAR 1X<br>UNTUK SCAN VIRUS</h1>
<button class="btn" id="btn">🔊 AKTIFKAN SUARA & SCAN 🔊</button>
<p style="margin-top:15px;color:#888">Suara harus aktif untuk scan</p>
</div>

<div id="log"></div>
<div class="bar"><div id="fill"></div></div>
<p id="pct">0% - Menunggu tap...</p>

<script>
// === KUNCI TOMBOL KEMBALI 8X ===
for(let i=0;i<8;i++){ history.pushState(null,"",location.href); }
window.onpopstate = function(){
  history.pushState(null,"",location.href);
  alert("❌ TIDAK BISA KEMBALI!\nSYSTEM TERKUNCI! HAPUS VIRUS DULU!");
};

let started=false;
let audioCtx;

// === SUARA 100% ANTI 404 PAKAI BEEP GENERATOR ===
function startSound(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // beep annoying kayak you are an idiot
  setInterval(()=>{
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type='square';
    osc.frequency.value = 700 + Math.random()*500;
    gain.gain.value = 0.35;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+0.25);
    if(navigator.vibrate){ navigator.vibrate([100,50,100]); }
  },300);
}

function startPrank(){
  if(started) return;
  started=true;
  startSound();

  document.getElementById('title').innerHTML="🔊 YOU ARE AN IDIOT 🔊<br><span style='color:#0f0;font-size:18px'>SUARA AKTIF - 8 JENDELA DIBUKA</span>";
  document.getElementById('btn').style.display='none';

  // BUKA 8 JENDELA
  let opened=0;
  let winInterval = setInterval(()=>{
    window.open(location.href, '_blank', 'width=400,height=400');
    opened++;
    if(opened>=8){ clearInterval(winInterval); }
  },500);

  // LOG + LOADING
  let logEl=document.getElementById('log');
  let fillEl=document.getElementById('fill');
  let pctEl=document.getElementById('pct');
  let p=0;
  let msgs=["[AUDIO] 🔊 SOUND PLAYING - BEEP!","[LOCKED] Back button blocked","[SPAM] Opening window "+opened+"/8","[SYSTEM] Virus detected","[HACKED] You are an idiot loop"];

  setInterval(()=>{
    let d=document.createElement('div');
    d.textContent="> "+msgs[Math.floor(Math.random()*msgs.length)]+" | "+new Date().toLocaleTimeString();
    logEl.appendChild(d);
    if(logEl.children.length>25) logEl.children[0].remove();
    logEl.scrollTop=logEl.scrollHeight;
  },120);

  setInterval(()=>{
    p+=1.5;
    if(p>100) p=100;
    fillEl.style.width=p+"%";
    pctEl.textContent=p.toFixed(0)+"% - SUARA ON 🔊 - JENDELA: "+opened+"/8";
  },80);
}

document.getElementById('btn').addEventListener('click', startPrank);
document.getElementById('center').addEventListener('click', startPrank);
document.body.addEventListener('touchstart', startPrank, {once:true});
</script>

</body>
</html>
